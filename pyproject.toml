[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omarchy-sayit"
version = "0.1.1"
description = "Local text-to-speech for Omarchy and Hyprland"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
sayit = "sayit.cli:main"

[tool.setuptools.package-data]
sayit = ["*.json", "locks/*"]

[tool.setuptools.packages.find]
include = ["sayit*"]
